[package]
name = "spider-news-radar"
version = "0.1.0"
description = "Spider News Radar Desktop App"
authors = ["Spider Radar Team"]
edition = "2021"

[lib]
name = "spider_news_radar_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
